# clamd for the vault: listens only on the internal Docker network.
Foreground yes
LogTime yes
LogFile /dev/stdout
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
# allow uploads up to the vault's limit (VAULT_MAX_MB) plus room for archives inside documents
StreamMaxLength 120M
MaxFileSize 120M
MaxScanSize 300M
ScanPDF yes
ScanOLE2 yes
ScanArchive yes
AlertBrokenExecutables yes
